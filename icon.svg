<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="centerOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" stroke="#1e293b" stroke-width="6" />

  <!-- Outer Crucible Geometry -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGlow)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="url(#centerOrb)" />

  <!-- Wi-Fi Node Waves at Top -->
  <path d="M 176 140 A 110 110 0 0 1 336 140" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 206 170 A 70 70 0 0 1 306 170" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <circle cx="256" cy="198" r="7" fill="#93c5fd" />

  <!-- Crucible Vessel Form -->
  <path d="M 160 220 C 160 330 200 360 256 360 C 312 360 352 330 352 220 Z" fill="#1e1b4b" stroke="url(#primaryGlow)" stroke-width="7" stroke-linejoin="round" />

  <!-- Inner Molten Core & Regression Check Symbol -->
  <path d="M 185 240 C 185 320 215 340 256 340 C 297 340 327 320 327 240 Z" fill="#311042" opacity="0.7"/>
  
  <!-- Checkmark / Regression Spark inside Crucible -->
  <path d="M 215 285 L 242 312 L 298 256" fill="none" stroke="url(#amberGlow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Crucible Pedestal Stand -->
  <path d="M 210 360 L 190 400 L 322 400 L 302 360 Z" fill="#0f172a" stroke="#475569" stroke-width="5" stroke-linejoin="round" />
  <rect x="175" y="400" width="162" height="14" rx="7" fill="#334155" />

  <!-- Radiating Energy Sparks -->
  <circle cx="150" cy="170" r="4" fill="#ec4899" />
  <circle cx="362" cy="170" r="4" fill="#38bdf8" />
  <circle cx="130" cy="270" r="3" fill="#fbbf24" />
  <circle cx="382" cy="270" r="3" fill="#818cf8" />
</svg>
